# Study App Schema for Firebase DataConnect

# User profile keyed by Firebase Auth UID
type User @table {
  # `@default(expr: "auth.uid")` sets it to Firebase Auth UID during insert and upsert.
  id: String! @default(expr: "auth.uid")
  # User preferences for study app
  preferences: Json! @default(expr: "{}")
  # Study statistics that sync across devices
  totalStudyTime: Int! @default(0)
  totalSessions: Int! @default(0)
  quizzesCompleted: Int! @default(0)
  averageQuizScore: Float! @default(0.0)
  streakDays: Int! @default(0)
  lastStudyDate: Date
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# Subjects (without slides - slides remain local-only)
type Subject @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  name: String! @col(dataType: "varchar(200)")
  description: String @col(dataType: "text")
  color: String! @default("#6366f1") @col(dataType: "varchar(7)")
  slideCount: Int! @default(0) # Track number of slides locally
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# Quizzes for assessment
type Quiz @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  subject: Subject!
  title: String! @col(dataType: "varchar(300)")
  questions: Json! # Array of QuizQuestion objects
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# Study plans for scheduling
type StudyPlan @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  subject: Subject!
  date: Date!
  taskType: String! @col(dataType: "enum('study','review','quiz')")
  taskId: String # Reference to quiz or other task
  completed: Boolean! @default(false)
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# Spaced repetition flashcards
type SpacedRepetitionCard @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  subject: Subject!
  question: String! @col(dataType: "text")
  answer: String! @col(dataType: "text")
  easeFactor: Float! @default(2.5)
  interval: Int! @default(1) # Days until next review
  nextReviewDate: Date! @default(expr: "request.time")
  reviewCount: Int! @default(0)
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# Study sessions for tracking progress
type StudySession @table {
  id: String! @default(expr: "uuidV4()")
  user: User!
  subject: Subject!
  type: String! @col(dataType: "enum('slide','quiz','spaced')")
  startTime: Date! @default(expr: "request.time")
  endTime: Date
  completed: Boolean! @default(false)
  duration: Int # Duration in minutes
  createdAt: Date! @default(expr: "request.time")
}
