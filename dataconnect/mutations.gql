# Mutations for Study App DataConnect

# Create or update user profile
mutation UpsertUser($input: UserUpsertInput!) {
  user_upsert(input: $input) {
    id
    preferences
    totalStudyTime
    totalSessions
    quizzesCompleted
    averageQuizScore
    streakDays
    lastStudyDate
    updatedAt
  }
}

# Create a new subject
mutation CreateSubject($input: SubjectInsertInput!) {
  subject_insert(input: $input) {
    id
    name
    description
    color
    slideCount
    createdAt
    updatedAt
  }
}

# Update an existing subject
mutation UpdateSubject($id: String!, $updates: SubjectUpdateInput!) {
  subject_update(id: $id, updates: $updates) {
    id
    name
    description
    color
    slideCount
    updatedAt
  }
}

# Delete a subject
mutation DeleteSubject($id: String!) {
  subject_delete(id: $id)
}

# Create a new quiz
mutation CreateQuiz($input: QuizInsertInput!) {
  quiz_insert(input: $input) {
    id
    subject {
      id
      name
    }
    title
    questions
    createdAt
    updatedAt
  }
}

# Update an existing quiz
mutation UpdateQuiz($id: String!, $updates: QuizUpdateInput!) {
  quiz_update(id: $id, updates: $updates) {
    id
    title
    questions
    updatedAt
  }
}

# Delete a quiz
mutation DeleteQuiz($id: String!) {
  quiz_delete(id: $id)
}

# Create a new study plan
