<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-security-policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://unpkg.com https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https: wss: blob: data: https://apis.google.com https://accounts.google.com https://identitytoolkit.googleapis.com https://*.firebaseio.com https://*.googleapis.com https://studyflow-f149a.firebaseapp.com https://studyflow-f149a.firebaseio.com; img-src 'self' data: blob: https:; frame-src 'self' https://apis.google.com https://accounts.google.com https://studyflow-f149a.firebaseapp.com https://*.firebaseapp.com https://*.googleapis.com; worker-src 'self' blob:;">
    <link rel="manifest" href="/manifest.webmanifest">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present from the 404.html,
      // and if it is, converts the redirect back into the correct url and
      // passes it to React Router.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
